<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LED 控制器</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1c1e21;--mute:#6b7280;--line:#e3e5e8;--acc:#2563eb;--warn:#b45309;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1b1e23;--fg:#e8eaed;--mute:#9aa0a6;--line:#2c3037;--acc:#5b8def;--warn:#f59e0b;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{padding:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;max-width:1100px;margin:auto}
h1{font-size:20px;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px;color:var(--mute)}
.chip b{color:var(--fg);font-weight:600}
main{max-width:1100px;margin:auto;padding:0 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.off{opacity:.55}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row label{min-width:52px;color:var(--mute);font-size:13px}
.row input[type=range]{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mute);font-size:12px}
.warn{color:var(--warn);font-size:12px}
select,input[type=text],input[type=password],input[type=number]{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;min-width:0}
select{flex:1}
input[type=color]{width:44px;height:30px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.danger{background:var(--bad)}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:before{transform:translateX(20px)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches i{width:22px;height:22px;border-radius:50%;cursor:pointer;border:1px solid var(--line)}
details{margin-top:6px}
summary{cursor:pointer;color:var(--mute);font-size:13px}
h2{font-size:15px;margin:22px 0 10px;color:var(--mute);font-weight:600}
.form{display:grid;gap:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
.toast.show{opacity:.95}
</style>
</head>
<body>
<header>
  <h1>LED 控制器</h1>
  <div class="chips">
    <span class="chip">WiFi <b id="c-wifi">–</b></span>
    <span class="chip">输入 <b id="c-volt">–</b></span>
    <span class="chip">运行 <b id="c-up">–</b></span>
  </div>
</header>
<main>
  <div class="card" id="all">
    <div class="top"><div class="name">全部灯带</div>
      <div class="row" style="margin:0"><button class="ghost" data-all="off">全关</button><button data-all="on">全开</button></div></div>
    <div class="row"><label>亮度</label><input type="range" min="1" max="255" id="all-bri"></div>
    <div class="row"><label>颜色</label><input type="color" id="all-color"><div class="swatches" id="all-sw"></div></div>
    <div class="row"><label>效果</label><select id="all-fx"></select></div>
  </div>

  <h2>各路输出</h2>
  <div class="grid" id="strips"></div>

  <h2>设置</h2>
  <div class="grid">
    <div class="card form">
      <div class="name">WiFi</div>
      <div class="sub" id="wifi-now"></div>
      <input type="text" id="w-ssid" placeholder="WiFi 名称" autocomplete="off">
      <input type="password" id="w-pass" placeholder="密码（开放网络留空）">
      <button id="w-save">保存并重启</button>
    </div>
    <div class="card form">
      <div class="name">通用</div>
      <div class="row"><label>主机名</label><input type="text" id="g-host" style="flex:1"></div>
      <div class="sub">改主机名需要重启，之后用 http://主机名.local 访问</div>
      <div class="row"><label>渐变</label><input type="number" id="g-trans" min="0" max="10000" step="100" style="width:100px"> ms</div>
      <div class="row"><button id="g-save">保存</button><button class="ghost" id="reboot">重启</button></div>
    </div>
    <div class="card form">
      <div class="name">固件升级</div>
      <div class="sub" id="ver"></div>
      <input type="file" id="fw" accept=".bin">
      <button id="fw-go">上传并升级</button>
      <div class="sub" id="fw-prog"></div>
      <hr style="border:0;border-top:1px solid var(--line);width:100%">
      <button class="danger" id="factory">恢复出厂设置</button>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const FX_GROUPS = [
  ["静态", {solid:"纯色",gradient:"双色渐变"}],
  ["彩虹", {rainbow:"彩虹渐变",rainbow_cycle:"彩虹流动",rainbow_chase:"彩虹跑马",confetti:"彩色纸屑"}],
  ["动感", {breathe:"呼吸",heartbeat:"心跳",wave:"波浪",color_wipe:"逐个点亮",theater_chase:"跑马灯",scanner:"扫描",meteor:"流星",police:"警灯"}],
  ["氛围", {twinkle:"闪烁星光",sparkle:"白光闪点",candle:"烛光",fire:"火焰",ocean:"海浪"}],
];
// 这些效果不用主色（颜色选择对它们无效）
const FX_NO_COLOR = ["rainbow","rainbow_cycle","rainbow_chase","confetti","police","fire","ocean"];
const fxOpts = sel => FX_GROUPS.map(([g,o])=>`<optgroup label="${g}">${opts(o,sel)}</optgroup>`).join("");
const ORDERS = ["GRB","RGB","BRG","RBG","GBR","BGR","GRBW","RGBW"];
const SW = ["#ffffff","#ffb46b","#ff3b30","#ff9500","#ffcc00","#34c759","#00c7be","#007aff","#af52de","#ff2d55"];
const $ = s => document.querySelector(s);
let S = null, busyUntil = 0;

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2500)}
const hex = c => "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
const rgb = h => [1,3,5].map(i=>parseInt(h.substr(i,2),16));
const opts = (o,sel) => Object.entries(o).map(([k,v])=>`<option value="${k}"${k===sel?" selected":""}>${v}</option>`).join("");
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, body){
  const r = await fetch(path, body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({error:"响应格式错误"}));
  if(!r.ok) throw new Error(j.error||r.status);
  return j;
}

// 滑条拖动时限流，最后一次一定发出
const pending = new Map();
function patch(ids, p, now){
  busyUntil = Date.now()+1500;
  const key = ids.join(",")+":"+Object.keys(p).join(",");
  const send = () => api("/api/strips",{ids,patch:p}).then(j=>{S=j;renderStatus()}).catch(e=>toast(e.message));
  if(now){pending.delete(key);return send()}
  const e = pending.get(key);
  if(e){e.p=p;return}
  pending.set(key,{p});
  setTimeout(()=>{const x=pending.get(key);pending.delete(key);if(x){p=x.p;send()}},120);
}
const enabledIds = () => S.strips.map((s,i)=>s.enabled?i:-1).filter(i=>i>=0);

function renderStrips(){
  const box = $("#strips");
  box.innerHTML = S.strips.map((s,i)=>{
    const ch = S.channels[i];
    return `<div class="card${s.enabled?"":" off"}" data-i="${i}">
      <div class="top"><div style="min-width:0"><div class="name">${esc(s.name)}</div>
        <div class="sub">${ch.connector} · GPIO${ch.gpio} · ${s.count} 颗 ${s.order}</div>
        ${ch.psram_pin?'<div class="warn">此脚与 PSRAM 共用，仅在固件未启用 PSRAM 时可用</div>':""}</div>
        <label class="sw"><input type="checkbox" data-k="on"${s.on?" checked":""}${s.enabled?"":" disabled"}><span></span></label></div>
      <div class="row"><label>亮度</label><input type="range" min="1" max="255" value="${s.brightness}" data-k="brightness"></div>
      <div class="row"><label>颜色</label><input type="color" value="${hex(s.color)}" data-k="color">
        ${s.order.endsWith("W")?`<label style="min-width:auto">白</label><input type="range" min="0" max="255" value="${s.white}" data-k="white">`:""}</div>
      <div class="row"><label>效果</label><select data-k="effect">${fxOpts(s.effect)}</select></div>
      ${s.effect==="gradient"?`<div class="row"><label>副色</label><input type="color" value="${hex(s.color2)}" data-k="color2"></div>`:""}
      ${FX_NO_COLOR.includes(s.effect)?'<div class="sub">这个效果自带配色，不使用上面的颜色</div>':""}
      <div class="row"><label>速度</label><input type="range" min="1" max="255" value="${s.speed}" data-k="speed"></div>
      <details><summary>这一路的设置</summary>
        <div class="row"><label>启用</label><label class="sw"><input type="checkbox" data-k="enabled"${s.enabled?" checked":""}><span></span></label></div>
        <div class="row"><label>名称</label><input type="text" value="${esc(s.name)}" data-k="name" style="flex:1"></div>
        <div class="row"><label>灯数</label><input type="number" min="1" max="1000" value="${s.count}" data-k="count" style="width:90px"></div>
        <div class="row"><label>色序</label><select data-k="order">${opts(Object.fromEntries(ORDERS.map(o=>[o,o])),s.order)}</select></div>
        <div class="row"><label>反向</label><label class="sw"><input type="checkbox" data-k="reverse"${s.reverse?" checked":""}><span></span></label></div>
      </details></div>`;
  }).join("");
}

$("#strips").addEventListener("input", e=>{
  const el=e.target, k=el.dataset.k; if(!k) return;
  const i=+el.closest("[data-i]").dataset.i;
  if(el.type==="range") patch([i],{[k]:+el.value});
  if(el.type==="color") patch([i],{[k]:rgb(el.value)});
});
$("#strips").addEventListener("change", e=>{
  const el=e.target, k=el.dataset.k; if(!k) return;
  const i=+el.closest("[data-i]").dataset.i;
  let v;
  if(el.type==="checkbox") v=el.checked;
  else if(el.type==="number") v=+el.value;
  else if(el.type==="range") v=+el.value;
  else if(el.type==="color") v=rgb(el.value);
  else v=el.value;
  const structural = ["enabled","order","name","count","effect"].includes(k);
  patch([i],{[k]:v},true)?.then(()=>{ if(structural) renderStrips(); });
});

// 全部
$("#all").addEventListener("click", e=>{
  const a=e.target.dataset.all; if(!a) return;
  patch(enabledIds(),{on:a==="on"},true).then(renderStrips);
});
$("#all-bri").addEventListener("input", e=>patch(enabledIds(),{brightness:+e.target.value,on:true}));
$("#all-bri").addEventListener("change", ()=>renderStrips());
$("#all-color").addEventListener("input", e=>patch(enabledIds(),{color:rgb(e.target.value),on:true}));
$("#all-color").addEventListener("change", ()=>renderStrips());
$("#all-fx").innerHTML = fxOpts("solid");
$("#all-fx").addEventListener("change", e=>patch(enabledIds(),{effect:e.target.value,on:true},true).then(renderStrips));
$("#all-sw").innerHTML = SW.map(c=>`<i style="background:${c}" data-c="${c}"></i>`).join("");
$("#all-sw").addEventListener("click", e=>{
  const c=e.target.dataset.c; if(!c) return;
  $("#all-color").value=c;
  patch(enabledIds(),{color:rgb(c),effect:"solid",on:true},true).then(renderStrips);
});

function fmtUp(s){const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d}天${h}时`:h?`${h}时${m}分`:`${m}分`}
function renderStatus(){
  const n=S.net;
  $("#c-wifi").textContent = n.sta_connected ? `${n.sta_ssid} ${n.rssi??""}dBm` : (n.ap_ssid ? `热点 ${n.ap_ssid}` : "未连接");
  $("#c-volt").textContent = (S.voltage_mv/1000).toFixed(1)+" V";
  $("#c-up").textContent = fmtUp(S.uptime_s);
  $("#wifi-now").textContent = S.wifi_ssid ? `当前：${S.wifi_ssid}${n.sta_ip?" · "+n.sta_ip:""}` : "还没配置 WiFi，现在是热点模式";
  $("#ver").textContent = `当前版本 v${S.version} · 空闲内存 ${(S.free_heap/1024).toFixed(0)} KB`;
}

async function load(full){
  try{
    const j = await api("/api/state");
    if(Date.now()<busyUntil && !full) { S.net=j.net; S.voltage_mv=j.voltage_mv; S.uptime_s=j.uptime_s; renderStatus(); return; }
    const first = !S; S=j;
    renderStatus();
    // 正在编辑的输入框不打断
    if(first || full || !document.activeElement.closest("#strips")) renderStrips();
    if(first){
      $("#g-host").value=S.hostname; $("#g-trans").value=S.transition_ms; $("#w-ssid").value=S.wifi_ssid;
      const on=S.strips.find(s=>s.enabled)||S.strips[0];
      $("#all-bri").value=on.brightness; $("#all-color").value=hex(on.color);
    }
  }catch(e){ $("#c-wifi").textContent="连接断开"; }
}

$("#w-save").onclick = async ()=>{
  const ssid=$("#w-ssid").value.trim(), password=$("#w-pass").value;
  if(!ssid && !confirm("WiFi 名称为空，将只开热点。继续？")) return;
  try{ await api("/api/wifi",{ssid,password}); toast("已保存，正在重启…连上同一网络后访问 http://"+S.hostname+".local"); }catch(e){toast(e.message)}
};
$("#g-save").onclick = async ()=>{
  try{ S=await api("/api/settings",{hostname:$("#g-host").value,transition_ms:+$("#g-trans").value}); $("#g-host").value=S.hostname; toast("已保存"); }catch(e){toast(e.message)}
};
$("#reboot").onclick = async ()=>{ if(confirm("确定重启？")){ await api("/api/reboot",{}).catch(()=>{}); toast("正在重启…"); } };
$("#factory").onclick = async ()=>{ if(confirm("清除所有设置（包括 WiFi）并重启？")){ await api("/api/factory-reset",{}).catch(()=>{}); toast("已恢复出厂，请连接 LEDCTL- 开头的热点"); } };
$("#fw-go").onclick = ()=>{
  const f=$("#fw").files[0]; if(!f) return toast("先选择 .bin 固件文件");
  const x=new XMLHttpRequest();
  x.open("POST","/api/ota");
  x.upload.onprogress=e=>{ if(e.lengthComputable) $("#fw-prog").textContent=`上传中 ${(e.loaded/e.total*100).toFixed(0)}%`; };
  x.onload=()=>{ let j={}; try{j=JSON.parse(x.responseText)}catch(_){}
    $("#fw-prog").textContent = x.status===200 ? "升级成功，正在重启…" : (j.error||"升级失败"); };
  x.onerror=()=>$("#fw-prog").textContent="上传失败";
  x.send(f);
};

load(true);
setInterval(load, 3000);
</script>
</body>
</html>
